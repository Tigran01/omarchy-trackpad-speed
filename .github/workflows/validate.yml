name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n scripts/trackpad-speed scripts/install-app-entry
      - name: Validate JSON
        run: jq -e . manifest.json >/dev/null
      - name: Check required plugin files
        run: test -f Panel.qml && test -f Service.qml && test -f manifest.json
